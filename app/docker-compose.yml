name: app

services:
  mongodb:
    image: docker.io/mongo:7.0
    container_name: mern_mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=creditcardapp
    volumes:
      - mongo_data:/data/db
      - ./databaseSchema/CreditCard.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mern_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGODB_URI=${DOCKER_MONGODB_URI:-mongodb://mongodb:27017/creditcardapp}
      - JWT_SECRET=${JWT_SECRET:-spendsignal_dev_jwt_secret_key_2026}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mern_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=https://mern.teedlej.com
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - api
    command: npm run dev

volumes:
  mongo_data:
