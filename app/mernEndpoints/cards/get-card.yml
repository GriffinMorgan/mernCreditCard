info:
  name: Get Card
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/cards/:cardId"
  params:
    - name: cardId
      value: "{{cardId}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() {
          expect(res.status).to.equal(200);
        });
        test("returns the requested card", function() {
          expect(res.body._id).to.equal(bru.getVar("cardId"));
        });

settings:
  encodeUrl: true
