info:
  name: Get User
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/users/:userId"
  params:
    - name: userId
      value: "{{userId}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function() {
          expect(res.status).to.equal(200);
        });
        test("returns the logged-in user", function() {
          expect(res.body._id).to.equal(bru.getVar("userId"));
        });

settings:
  encodeUrl: true
